name: OpenCode attempt
description: Run one primary OpenCode execution and publish durable work when requested.
inputs:
  attempt:
    required: true
    default: "1"
  model:
    required: false
    default: opencode/mimo-v2.6-flash-free
  target_number:
    required: false
    default: "0"
  base_ref:
    required: false
    default: main
  initial_sha:
    required: true
  mode:
    required: false
    default: local
  task_mode:
    required: false
    default: code
outputs:
  agent_outcome:
    value: ${{ steps.run.outputs.agent_outcome }}
  termination_reason:
    value: ${{ steps.run.outputs.termination_reason }}
  verified:
    value: ${{ steps.run.outputs.verified }}
  timed_out:
    value: ${{ steps.run.outputs.timed_out }}
  pr_url:
    value: ${{ steps.run.outputs.pr_url }}
  verified_sha:
    value: ${{ steps.run.outputs.verified_sha }}
  ci_surfaces:
    value: ${{ steps.run.outputs.ci_surfaces }}
  ci_run_id:
    value: ${{ steps.run.outputs.ci_run_id }}
  publish_outcome:
    value: ${{ steps.run.outputs.publish_outcome }}
  safe_log_path:
    value: ${{ steps.run.outputs.safe_log_path }}
  attempt_elapsed_seconds:
    value: ${{ steps.run.outputs.attempt_elapsed_seconds }}
  result_state:
    value: ${{ steps.run.outputs.result_state }}
  durable_work:
    value: ${{ steps.run.outputs.durable_work }}
  session_head_sha:
    value: ${{ steps.run.outputs.session_head_sha }}
runs:
  using: composite
  steps:
    - name: Execute primary OpenCode lifecycle
      id: run
      shell: bash
      env:
        ATTEMPT: ${{ inputs.attempt }}
        MODEL: ${{ inputs.model }}
        OC_TARGET_MODE: ${{ inputs.mode }}
        TASK_MODE: ${{ inputs.task_mode }}
        TARGET_NUMBER: ${{ inputs.target_number }}
        BASE_REF: ${{ inputs.base_ref }}
        INITIAL_SHA: ${{ inputs.initial_sha }}
      run: bash .github/scripts/run-attempt-pipeline.sh
