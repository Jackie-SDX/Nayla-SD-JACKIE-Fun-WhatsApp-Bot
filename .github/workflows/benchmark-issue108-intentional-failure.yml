name: benchmark-108-intentional-failure

# TEMPORARY benchmark-only scaffolding for issue #108 acceptance criterion 8.
# This workflow exists solely so the autonomous controller can observe a real
# remote CI failure log on the exact PR head, then remove this file as the
# same-branch repair. It must NOT remain in the final PR diff.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intentional-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Intentional benchmark-only failure
        shell: bash
        run: |
          set -euo pipefail
          echo "::error title=benchmark-108-intentional-failure::Deliberate temporary CI failure for issue #108 benchmark log observation"
          echo "This step fails on purpose so the agent can capture the real remote"
          echo "GitHub Actions failure log for the exact PR head SHA, then remove this"
          echo "workflow and re-observe the same PR going green."
          exit 1
