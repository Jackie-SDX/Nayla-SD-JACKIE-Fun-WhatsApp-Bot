name: oc-control

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  retry-failed-jobs:
    if: |
      github.event.comment.user.login == github.repository_owner &&
      (
        startsWith(github.event.comment.body, '/oc retry failed jobs') ||
        startsWith(github.event.comment.body, '/opencode retry failed jobs')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ secrets.UNIVERSAL_TOKEN || github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Execute selective failed-job retry
        shell: bash
        run: bash .github/scripts/retry-oc-failed-jobs.sh
