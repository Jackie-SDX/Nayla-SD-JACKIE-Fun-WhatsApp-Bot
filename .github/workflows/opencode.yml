name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      github.event.comment.user.login == github.repository_owner &&
      (
        startsWith(github.event.comment.body, '/oc') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      COPILOT_MAX_AI_CREDITS: "60"
      OPENCODE_V2_VERSION: "2.0.3"
      COPILOT_CLI_VERSION: "1.0.86"
      OPENCODE_ZEN_FREE_MODELS: "big-pickle,mimo-v2.5-free,ling-3.0-flash-fin-free,nemotron-3-ultra-free,nemotron-3.5-lightning-free,muse-spark-1.3-contributor-free,jev-1.13-free,deepseek-v4-flash-free"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate command gate
        id: command_gate
        shell: bash
        run: |
          set -euo pipefail
          body="$(jq -r '.comment.body // empty' "$GITHUB_EVENT_PATH")"
          if [[ "$body" =~ ^/(oc|opencode)([[:space:]]|$) ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Accepted /oc or /opencode command prefix."
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Comment is not a valid /oc command; no agent work will run."
          fi

      - name: Capture initial state
        id: initial_state
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          echo "Initial checkout SHA: $sha"

      - name: Verify pinned OpenCode V2 runtime
        id: opencode_release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OPENCODE_V2_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm view "@opencode/cli@${OPENCODE_V2_VERSION}" version --json | jq -e --arg v "$OPENCODE_V2_VERSION" '. == $v' >/dev/null
          echo "version=$OPENCODE_V2_VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore verified OpenCode V2 cache
        id: cache_restore
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.opencode
          key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENCODE_V2_VERSION }}

      - name: Install OpenCode V2 on cache miss
        if: steps.cache_restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/.opencode"
          npm install --prefix "$HOME/.opencode" --no-audit --no-fund --prefer-online --save-exact "@opencode/cli@${OPENCODE_V2_VERSION}"
          test -x "$HOME/.opencode/node_modules/.bin/opencode"
          actual="$("$HOME/.opencode/node_modules/.bin/opencode" --version)"
          echo "OpenCode V2 runtime: $actual"
          [[ "$actual" == *"$OPENCODE_V2_VERSION"* ]]

      - name: Add OpenCode V2 to PATH
        shell: bash
        run: echo "$HOME/.opencode/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Validate OpenCode agent council
        id: agent_council
        if: steps.command_gate.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/validate-opencode-council.sh

      - name: Resolve credential availability
        id: credentials
        if: steps.command_gate.outputs.valid == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$OPENCODE_API_KEY" ]] && echo "opencode=true" >> "$GITHUB_OUTPUT" || echo "opencode=false" >> "$GITHUB_OUTPUT"
          [[ -n "$COPILOT_GITHUB_TOKEN" ]] && echo "copilot=true" >> "$GITHUB_OUTPUT" || echo "copilot=false" >> "$GITHUB_OUTPUT"
          [[ -n "$COMPOSIO_API_KEY" ]] && echo "composio=true" >> "$GITHUB_OUTPUT" || echo "composio=false" >> "$GITHUB_OUTPUT"

      - name: Select route 1
        id: route_1
        if: steps.command_gate.outputs.valid == 'true'
        env:
          HAS_OPENCODE_CREDENTIAL: ${{ steps.credentials.outputs.opencode }}
          HAS_COPILOT_CREDENTIAL: ${{ steps.credentials.outputs.copilot }}
          OPENCODE_ZEN_FREE_MODELS: ${{ env.OPENCODE_ZEN_FREE_MODELS }}
        shell: bash
        run: bash .github/scripts/select-opencode-route.sh

      - name: Preflight credentials
        if: steps.command_gate.outputs.valid == 'true'
        env:
          ROUTE_PROVIDER: ${{ steps.route_1.outputs.provider }}
          HAS_OPENCODE_CREDENTIAL: ${{ steps.credentials.outputs.opencode }}
          HAS_COPILOT_CREDENTIAL: ${{ steps.credentials.outputs.copilot }}
          HAS_COMPOSIO_CREDENTIAL: ${{ steps.credentials.outputs.composio }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ROUTE_PROVIDER" in
            opencode) [[ "$HAS_OPENCODE_CREDENTIAL" == "true" ]] || exit 1 ;;
            github-copilot) [[ "$HAS_COPILOT_CREDENTIAL" == "true" ]] || exit 1 ;;
            *) echo "::error title=No usable agent route::No valid provider was selected."; exit 1 ;;
          esac
          [[ "$HAS_COMPOSIO_CREDENTIAL" == "true" ]] || echo "::warning title=Composio unavailable::Continuing without optional Composio MCP."
          echo "Credential availability gate passed for: $ROUTE_PROVIDER"

      - name: Bootstrap Composio session MCP
        id: composio_session
        if: steps.command_gate.outputs.valid == 'true' && steps.credentials.outputs.composio == 'true'
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ vars.COMPOSIO_USER_ID || github.repository_owner }}
        shell: bash
        run: bash .github/scripts/prepare-composio-mcp.sh


      - name: Prepare Copilot branch for attempt 1
        if: steps.command_gate.outputs.valid == 'true' && steps.route_1.outputs.provider == 'github-copilot'
        shell: bash
        env:
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
        run: |
          set -euo pipefail
          branch="oc/copilot-$TARGET_NUMBER-$GITHUB_RUN_ID-1"
          git switch -c "$branch"

      - name: Run agent attempt 1
        id: agent_1
        if: steps.command_gate.outputs.valid == 'true' && steps.route_1.outputs.selected == 'true'
        continue-on-error: true
        shell: bash
        env:
          SELECTED_PROVIDER: ${{ steps.route_1.outputs.provider }}
          OPENCODE_API_KEY: ${{ steps.route_1.outputs.provider == 'opencode' && secrets.OPENCODE_API_KEY || '' }}
          COPILOT_GITHUB_TOKEN: ${{ steps.route_1.outputs.provider == 'github-copilot' && secrets.COPILOT_GITHUB_TOKEN || '' }}
          COMPOSIO_MCP_URL: ${{ env.COMPOSIO_MCP_URL }}
          COMPOSIO_MCP_HEADERS_FILE: ${{ env.COMPOSIO_MCP_HEADERS_FILE }}
          INITIAL_SHA: ${{ steps.initial_state.outputs.sha }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -u
          case "$SELECTED_PROVIDER" in
            opencode)
              export MODEL="$OPENCODE_SELECTED_MODEL"
              export VARIANT=""
              export SHARE="false"
              export AGENT="build"
              bash .github/scripts/run-opencode-attempt.sh 1
              ;;
            github-copilot)
              bash .github/scripts/run-copilot-attempt.sh 1
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Publish OpenCode attempt 1
        id: opencode_publish_1
        if: steps.command_gate.outputs.valid == 'true' && steps.agent_1.outcome == 'success' && steps.route_1.outputs.provider == 'opencode'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_SHA: ${{ steps.initial_state.outputs.sha }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          OPENCODE_BRANCH: ${{ steps.agent_1.outputs.branch }}
          COUNCIL_EVIDENCE_DIR: ${{ steps.agent_1.outputs.evidence_dir }}
        run: bash .github/scripts/publish-opencode-change.sh

      - name: Publish Copilot attempt 1
        id: publish_1
        if: steps.command_gate.outputs.valid == 'true' && steps.agent_1.outcome == 'success' && steps.route_1.outputs.provider == 'github-copilot'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
        run: bash .github/scripts/publish-copilot-change.sh

      - name: Replay safety gate before attempt 2
        id: replay_2
        if: always() && steps.command_gate.outputs.valid == 'true' && steps.agent_1.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          INITIAL_SHA: ${{ steps.initial_state.outputs.sha }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          [[ "$current" == "$INITIAL_SHA" ]] || {
            echo "::error title=Unsafe replay::The failed agent changed the local commit state."
            exit 1
          }
          [[ -z "$(git status --porcelain)" ]] || exit 1
          if git ls-remote --heads origin "refs/heads/opencode/issue$TARGET_NUMBER-*" | grep -q . || git ls-remote --heads origin "refs/heads/opencode/council-issue$TARGET_NUMBER-*" | grep -q .; then
            echo "::error title=Unsafe replay::An existing OpenCode branch already exists for this target; preserving it."
            exit 1
          fi

      - name: Classify failure after attempt 1
        id: classify_1
        if: always() && steps.agent_1.outcome == 'failure'
        env:
          CURRENT_PROVIDER: ${{ steps.route_1.outputs.provider }}
          SAFE_LOG: ${{ steps.agent_1.outputs.safe_log_path }}
        shell: bash
        run: bash .github/scripts/classify-provider-failure.sh

      - name: Select route 2
        id: route_2
        if: steps.command_gate.outputs.valid == 'true' && steps.replay_2.outcome == 'success'
        env:
          HAS_OPENCODE_CREDENTIAL: ${{ steps.credentials.outputs.opencode }}
          HAS_COPILOT_CREDENTIAL: ${{ steps.credentials.outputs.copilot }}
          OPENCODE_ZEN_FREE_MODELS: ${{ env.OPENCODE_ZEN_FREE_MODELS }}
        shell: bash
        run: bash .github/scripts/select-opencode-route.sh

      - name: Prepare Copilot branch for attempt 2
        if: steps.command_gate.outputs.valid == 'true' && steps.route_2.outputs.provider == 'github-copilot'
        shell: bash
        env:
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
        run: |
          set -euo pipefail
          branch="oc/copilot-$TARGET_NUMBER-$GITHUB_RUN_ID-2"
          git switch -c "$branch"

      - name: Run agent attempt 2
        id: agent_2
        if: steps.command_gate.outputs.valid == 'true' && steps.route_2.outputs.selected == 'true'
        continue-on-error: true
        shell: bash
        env:
          SELECTED_PROVIDER: ${{ steps.route_2.outputs.provider }}
          OPENCODE_API_KEY: ${{ steps.route_2.outputs.provider == 'opencode' && secrets.OPENCODE_API_KEY || '' }}
          COPILOT_GITHUB_TOKEN: ${{ steps.route_2.outputs.provider == 'github-copilot' && secrets.COPILOT_GITHUB_TOKEN || '' }}
          COMPOSIO_MCP_URL: ${{ env.COMPOSIO_MCP_URL }}
          COMPOSIO_MCP_HEADERS_FILE: ${{ env.COMPOSIO_MCP_HEADERS_FILE }}
          INITIAL_SHA: ${{ steps.initial_state.outputs.sha }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -u
          case "$SELECTED_PROVIDER" in
            opencode)
              export MODEL="$OPENCODE_SELECTED_MODEL"
              export VARIANT=""
              export SHARE="false"
              export AGENT="build"
              bash .github/scripts/run-opencode-attempt.sh 2
              ;;
            github-copilot)
              bash .github/scripts/run-copilot-attempt.sh 2
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Publish OpenCode attempt 2
        id: opencode_publish_2
        if: steps.command_gate.outputs.valid == 'true' && steps.agent_2.outcome == 'success' && steps.route_2.outputs.provider == 'opencode'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_SHA: ${{ steps.initial_state.outputs.sha }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          OPENCODE_BRANCH: ${{ steps.agent_2.outputs.branch }}
          COUNCIL_EVIDENCE_DIR: ${{ steps.agent_2.outputs.evidence_dir }}
        run: bash .github/scripts/publish-opencode-change.sh

      - name: Publish Copilot attempt 2
        id: publish_2
        if: steps.command_gate.outputs.valid == 'true' && steps.agent_2.outcome == 'success' && steps.route_2.outputs.provider == 'github-copilot'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
        run: bash .github/scripts/publish-copilot-change.sh

      - name: Replay safety gate before attempt 3
        id: replay_3
        if: always() && steps.command_gate.outputs.valid == 'true' && steps.agent_2.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          INITIAL_SHA: ${{ steps.initial_state.outputs.sha }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          [[ "$current" == "$INITIAL_SHA" ]] || {
            echo "::error title=Unsafe replay::The failed agent changed the local commit state."
            exit 1
          }
          [[ -z "$(git status --porcelain)" ]] || exit 1
          if git ls-remote --heads origin "refs/heads/opencode/issue$TARGET_NUMBER-*" | grep -q .; then
            echo "::error title=Unsafe replay::An OpenCode branch already exists for this target; preserving it."
            exit 1
          fi

      - name: Classify failure after attempt 2
        id: classify_2
        if: always() && steps.agent_2.outcome == 'failure'
        env:
          CURRENT_PROVIDER: ${{ steps.route_2.outputs.provider }}
          SAFE_LOG: ${{ steps.agent_2.outputs.safe_log_path }}
        shell: bash
        run: bash .github/scripts/classify-provider-failure.sh

      - name: Select route 3
        id: route_3
        if: steps.command_gate.outputs.valid == 'true' && steps.replay_3.outcome == 'success'
        env:
          HAS_OPENCODE_CREDENTIAL: ${{ steps.credentials.outputs.opencode }}
          HAS_COPILOT_CREDENTIAL: ${{ steps.credentials.outputs.copilot }}
          OPENCODE_ZEN_FREE_MODELS: ${{ env.OPENCODE_ZEN_FREE_MODELS }}
        shell: bash
        run: bash .github/scripts/select-opencode-route.sh

      - name: Prepare Copilot branch for attempt 3
        if: steps.command_gate.outputs.valid == 'true' && steps.route_3.outputs.provider == 'github-copilot'
        shell: bash
        env:
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
        run: |
          set -euo pipefail
          branch="oc/copilot-$TARGET_NUMBER-$GITHUB_RUN_ID-3"
          git switch -c "$branch"

      - name: Run agent attempt 3
        id: agent_3
        if: steps.command_gate.outputs.valid == 'true' && steps.route_3.outputs.selected == 'true'
        continue-on-error: true
        shell: bash
        env:
          SELECTED_PROVIDER: ${{ steps.route_3.outputs.provider }}
          OPENCODE_API_KEY: ${{ steps.route_3.outputs.provider == 'opencode' && secrets.OPENCODE_API_KEY || '' }}
          COPILOT_GITHUB_TOKEN: ${{ steps.route_3.outputs.provider == 'github-copilot' && secrets.COPILOT_GITHUB_TOKEN || '' }}
          COMPOSIO_MCP_URL: ${{ env.COMPOSIO_MCP_URL }}
          COMPOSIO_MCP_HEADERS_FILE: ${{ env.COMPOSIO_MCP_HEADERS_FILE }}
          INITIAL_SHA: ${{ steps.initial_state.outputs.sha }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -u
          case "$SELECTED_PROVIDER" in
            opencode)
              export MODEL="$OPENCODE_SELECTED_MODEL"
              export VARIANT=""
              export AGENT="build"
              bash .github/scripts/run-opencode-attempt.sh 3
              ;;
            github-copilot)
              bash .github/scripts/run-copilot-attempt.sh 3
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Publish OpenCode attempt 3
        id: opencode_publish_3
        if: steps.command_gate.outputs.valid == 'true' && steps.agent_3.outcome == 'success' && steps.route_3.outputs.provider == 'opencode'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_SHA: ${{ steps.initial_state.outputs.sha }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          OPENCODE_BRANCH: ${{ steps.agent_3.outputs.branch }}
          COUNCIL_EVIDENCE_DIR: ${{ steps.agent_3.outputs.evidence_dir }}
        run: bash .github/scripts/publish-opencode-change.sh

      - name: Publish Copilot attempt 3
        id: publish_3
        if: steps.command_gate.outputs.valid == 'true' && steps.agent_3.outcome == 'success' && steps.route_3.outputs.provider == 'github-copilot'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
        run: bash .github/scripts/publish-copilot-change.sh

      - name: OpenCode success inspection
        if: always() && ((steps.agent_1.outcome == 'success' && steps.route_1.outputs.provider == 'opencode') || (steps.agent_2.outcome == 'success' && steps.route_2.outputs.provider == 'opencode') || (steps.agent_3.outcome == 'success' && steps.route_3.outputs.provider == 'opencode'))
        shell: bash
        run: |
          set -euo pipefail
          echo "OpenCode completed successfully."
          git status --short
          git branch --show-current
          git log -1 --oneline

      - name: Human handoff after exhausted or blocked recovery
        if: always() && steps.command_gate.outputs.valid == 'true' && steps.agent_1.outcome == 'failure' && (steps.agent_3.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          SAFE_LOG: ${{ steps.agent_3.outputs.safe_log_path || steps.agent_2.outputs.safe_log_path || steps.agent_1.outputs.safe_log_path }}
        shell: bash
        run: |
          set -euo pipefail
          findings="$(tail -n 100 "$SAFE_LOG" 2>/dev/null || printf '%s' 'No sanitized agent log was available.')"
          body="$(printf 'Agent recovery stopped without a fully verified success. No success is claimed.\n\nSanitized findings:\n\n%s' "$findings")"
          gh issue comment "$TARGET_NUMBER" --body "$body"

      - name: Upload OpenCode council evidence
        if: always() && steps.command_gate.outputs.valid == 'true' && (steps.agent_1.outputs.evidence_dir != '' || steps.agent_2.outputs.evidence_dir != '' || steps.agent_3.outputs.evidence_dir != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opencode-council-${{ github.run_id }}
          path: ${{ steps.agent_3.outputs.evidence_dir || steps.agent_2.outputs.evidence_dir || steps.agent_1.outputs.evidence_dir }}
          retention-days: 14
          if-no-files-found: warn
      - name: Routing summary
        if: always()
        env:
          R1: ${{ steps.route_1.outputs.route }}
          R2: ${{ steps.route_2.outputs.route }}
          R3: ${{ steps.route_3.outputs.route }}
          A1: ${{ steps.agent_1.outcome }}
          A2: ${{ steps.agent_2.outcome }}
          A3: ${{ steps.agent_3.outcome }}
          P1: ${{ steps.publish_1.outcome }}
          P2: ${{ steps.publish_2.outcome }}
          P3: ${{ steps.publish_3.outcome }}
          OP1: ${{ steps.opencode_publish_1.outcome }}
          OP2: ${{ steps.opencode_publish_2.outcome }}
          OP3: ${{ steps.opencode_publish_3.outcome }}
        run: |
          {
            echo "### /oc hybrid agent routing"
            echo ""
            echo "| Attempt | Route | Agent | OpenCode publish | Copilot publish |"
            echo "|---|---|---|---|"
            echo "| 1 | ${R1:-not selected} | ${A1:-not run} | ${OP1:-n/a} | ${P1:-n/a} |"
            echo "| 2 | ${R2:-not selected} | ${A2:-not run} | ${OP2:-n/a} | ${P2:-n/a} |"
            echo "| 3 | ${R3:-not selected} | ${A3:-not run} | ${OP3:-n/a} | ${P3:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Final status
        if: always()
        env:
          A1: ${{ steps.agent_1.outcome }}
          A2: ${{ steps.agent_2.outcome }}
          A3: ${{ steps.agent_3.outcome }}
          R1: ${{ steps.route_1.outputs.provider }}
          R2: ${{ steps.route_2.outputs.provider }}
          R3: ${{ steps.route_3.outputs.provider }}
          P1: ${{ steps.publish_1.outputs.published }}
          P2: ${{ steps.publish_2.outputs.published }}
          P3: ${{ steps.publish_3.outputs.published }}
          OP1: ${{ steps.opencode_publish_1.outputs.published }}
          OP2: ${{ steps.opencode_publish_2.outputs.published }}
          OP3: ${{ steps.opencode_publish_3.outputs.published }}
          COMMAND_VALID: ${{ steps.command_gate.outputs.valid }}
        run: |
          set -euo pipefail
          if [[ "$COMMAND_VALID" != "true" ]]; then
            echo "Comment did not contain an accepted command token; no agent work was executed."
            exit 0
          fi
          success=false
          if [[ "$A1" == "success" && "$R1" == "opencode" && "$OP1" == "true" ]]; then success=true; fi
          if [[ "$A2" == "success" && "$R2" == "opencode" && "$OP2" == "true" ]]; then success=true; fi
          if [[ "$A3" == "success" && "$R3" == "opencode" && "$OP3" == "true" ]]; then success=true; fi
          if [[ "$A1" == "success" && "$R1" == "github-copilot" && "$P1" == "true" ]]; then success=true; fi
          if [[ "$A2" == "success" && "$R2" == "github-copilot" && "$P2" == "true" ]]; then success=true; fi
          if [[ "$A3" == "success" && "$R3" == "github-copilot" && "$P3" == "true" ]]; then success=true; fi
          if [[ "$success" == "true" ]]; then
            echo "Hybrid agent completed successfully."
            exit 0
          fi
          echo "::error title=Hybrid agent recovery exhausted or blocked::No fully verified agent run was completed."
          exit 1
      - name: Clean up Composio session MCP
        if: always()
        continue-on-error: true
        env:
          SESSION_ID: ${{ steps.composio_session.outputs.session_id }}
          HEADERS_FILE: ${{ steps.composio_session.outputs.headers_file }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: bash .github/scripts/cleanup-composio-mcp.sh
