name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      github.event.comment.user.login == github.repository_owner &&
      (
        github.event.comment.body == '/oc' ||
        startsWith(github.event.comment.body, '/oc ') ||
        github.event.comment.body == '/opencode' ||
        startsWith(github.event.comment.body, '/opencode ')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Create isolated agent branch
        id: agent_branch
        shell: bash
        env:
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
        run: |
          set -euo pipefail
          branch="oc/$TARGET_NUMBER-$GITHUB_RUN_ID"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "Created isolated agent branch: $branch"

      - name: Set up Node.js for GitHub Copilot CLI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install pinned GitHub Copilot CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund @github/copilot@1.0.86
          copilot --version

      - name: Preflight credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo "::error title=GitHub Copilot credential missing::Add the COPILOT_GITHUB_TOKEN repository secret using a fine-grained token with Copilot Requests permission."
            exit 1
          fi
          if [[ -n "$COMPOSIO_API_KEY" ]]; then
            echo "Composio MCP credential: configured"
          else
            echo "::warning title=Composio unavailable::COMPOSIO_API_KEY is not configured; the agent will continue without Composio tools."
          fi
          echo "GitHub Copilot model route: auto"

      - name: Select first configured route
        id: route_1
        shell: bash
        run: bash .github/scripts/select-opencode-route.sh

      - name: Run GitHub Copilot attempt
        id: agent_1
        if: steps.route_1.outputs.selected == 'true'
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/run-copilot-attempt.sh 1

      - name: Inspect state after agent attempt
        if: always() && steps.agent_1.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          git diff --stat

      - name: Publish verified agent changes
        id: publish
        if: steps.agent_1.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --short)" ]]; then
            echo "Agent completed successfully with no repository changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          title="$(jq -r '.issue.title // .pull_request.title // "OpenCode task"' "$GITHUB_EVENT_PATH" | tr '\n' ' ' | cut -c1-72)"
          git commit -m "oc: $title"
          gh auth setup-git
          git push --set-upstream origin "$(git branch --show-current)"
          pr_body="$(cat <<EOF
Automated /oc task from issue or pull-request comment #$TARGET_NUMBER.

Model execution: GitHub Copilot CLI with automatic model selection.
The agent ran on an isolated branch and was prohibited from Git commit/push/reset/clean and GitHub CLI mutations.

Review the resulting diff and CI checks before merging.
EOF
          )"
          pr_url="$(gh pr create --base "$BASE_REF" --head "$(git branch --show-current)" --title "oc: $title" --body "$pr_body")"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pull_request_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Published verified agent changes as: $pr_url"

      - name: Post human handoff after failed agent attempt
        if: always() && steps.agent_1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          SAFE_LOG: ${{ steps.agent_1.outputs.safe_log_path }}
        shell: bash
        run: |
          set -euo pipefail
          findings="$(tail -n 100 "$SAFE_LOG" 2>/dev/null || printf '%s' 'No sanitized attempt log was available.')"
          body="$(printf 'GitHub Copilot agent attempt failed. No success is claimed. The isolated branch was preserved for inspection.\n\nSanitized findings:\n\n%s' "$findings")"
          gh issue comment "$TARGET_NUMBER" --body "$body"

      - name: Routing summary
        if: always()
        shell: bash
        env:
          R1: ${{ steps.route_1.outputs.route }}
          A1: ${{ steps.agent_1.outcome }}
          E1: ${{ steps.agent_1.outputs.exit_code }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          {
            echo "### GitHub-native agent routing"
            echo ""
            echo "| Attempt | Route | Agent result | Exit | Publish |"
            echo "|---|---|---|---|---|"
            echo "| 1 | $R1 | $A1 | $E1 | $PUBLISH |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Final status
        if: always()
        shell: bash
        env:
          A1: ${{ steps.agent_1.outcome }}
          P1: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          if [[ "$A1" == "success" && "$P1" == "success" ]]; then
            echo "GitHub Copilot agent completed successfully and any verified changes were published from an isolated branch."
            exit 0
          fi
          echo "::error title=GitHub-native agent execution failed::No fully verified agent run was completed."
          exit 1
