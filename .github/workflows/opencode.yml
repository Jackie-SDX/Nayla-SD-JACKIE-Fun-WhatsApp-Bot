name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  oc_claim:
    concurrency:
      group: oc-claim-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
    if: |
      github.event.comment.user.type == 'User' &&
      github.event.comment.user.login == github.repository_owner &&
      (
        startsWith(github.event.comment.body, '/oc ') ||
        github.event.comment.body == '/oc' ||
        startsWith(github.event.comment.body, '/opencode ') ||
        github.event.comment.body == '/opencode'
      ) &&
      !startsWith(github.event.comment.body, '/oc retry failed jobs') &&
      !startsWith(github.event.comment.body, '/opencode retry failed jobs')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.UNIVERSAL_TOKEN || github.token }}
    outputs:
      accepted: ${{ steps.claim.outputs.accepted }}
    steps:
      - name: Claim unique /oc comment delivery
        id: claim
        shell: bash
        run: bash .github/scripts/claim-oc-command.sh

  opencode:
    needs: oc_claim
    # Per-issue serialization with cancel-in-progress: false, scoped to the
    # exact command. The group is command-aware so that workflow-originated
    # noise comments (run markers, checkpoints, failure notices) land in a
    # distinct "-false" group and are skipped immediately instead of queuing
    # behind the active agent run as "pending" for its whole duration.
    #
    # Real /oc and /opencode commands serialize per issue via the "-true"
    # group, so two agents can never mutate the same issue concurrently.
    concurrency:
      group: oc-agent-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}-${{ (startsWith(github.event.comment.body, '/oc ') || github.event.comment.body == '/oc') || (startsWith(github.event.comment.body, '/opencode ') || github.event.comment.body == '/opencode') }}
      cancel-in-progress: false
    if: |
      needs.oc_claim.outputs.accepted == 'true' &&
      github.event.comment.user.type == 'User' &&
      github.event.comment.user.login == github.repository_owner &&
      (
        startsWith(github.event.comment.body, '/oc ') ||
        github.event.comment.body == '/oc' ||
        startsWith(github.event.comment.body, '/opencode ') ||
        github.event.comment.body == '/opencode'
      ) &&
      !startsWith(github.event.comment.body, '/oc retry failed jobs') &&
      !startsWith(github.event.comment.body, '/opencode retry failed jobs')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
      copilot-requests: write
    env:
      UNIVERSAL_TOKEN: ${{ secrets.UNIVERSAL_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.UNIVERSAL_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.UNIVERSAL_TOKEN || github.token }}
      OPENCODE_AGENT_TIMEOUT_MINUTES: "350"
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENCODE_ZEN_FREE_MODELS: ${{ vars.OPENCODE_ZEN_FREE_MODELS || 'big-pickle,mimo-v2.6-flash-free' }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_USER_ID: ${{ vars.COMPOSIO_USER_ID || github.repository_owner }}
      COPILOT_MAX_AI_CREDITS: "60"
      COPILOT_PEER_MAX_AI_CREDITS: "30"
      OC_CI_VERIFY_SETTLE_SECONDS: "30"
      OC_JOB_BUDGET_SECONDS: "21600"
      OC_JOB_SAFETY_MARGIN_SECONDS: "120"
      OC_PROGRESS_INTERVAL_SECONDS: "30"
      OC_CONTEXT_SEED_BYTES: "300000"
      OC_SESSION_CHECKPOINT_INTERVAL_SECONDS: "300"
      COPILOT_PEER_MAX_ROUNDS: "5"
      OC_CI_WATCH_MINUTES: "45"
      OC_CI_WATCH_POLL_SECONDS: "20"
      OPENCODE_BAD_MODELS: ${{ vars.OPENCODE_BAD_MODELS }}
      OPENCODE_BAD_MODELS_MAX_AGE_HOURS: ${{ vars.OPENCODE_BAD_MODELS_MAX_AGE_HOURS || '24' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Capture initial state
        id: initial_state
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          echo "OC_INITIAL_SHA=$sha" >> "$GITHUB_ENV"
          echo "OC_RUN_START_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "OC_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "Initial checkout SHA: $sha"

      - name: Register /oc run marker
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UNIVERSAL_TOKEN || github.token }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
        run: |
          set -euo pipefail
          [[ "$TARGET_NUMBER" =~ ^[0-9]+$ && "$TARGET_NUMBER" != "0" ]] || exit 0
          gh issue comment "$TARGET_NUMBER" --body "<!-- oc-run-id:${GITHUB_RUN_ID} issue:${TARGET_NUMBER} sha:${GITHUB_SHA} -->"

      - name: Mark triggering /oc comment as running
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/oc-running-reaction.sh add

      - name: Resolve /oc target
        id: target
        shell: bash
        env:
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
        run: bash .github/scripts/resolve-oc-target.sh

      - name: Capture complete task context
        id: context
        shell: bash
        env:
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          OC_CONTEXT_MAX_BYTES: "2000000"
        run: bash .github/scripts/collect-oc-context.sh

      - name: Select task mode
        id: task_mode
        shell: bash
        run: bash .github/scripts/oc-command-control.sh

      - name: Resolve and verify OpenCode release
        if: env.OC_TASK_MODE != 'merge'
        id: opencode_release
        shell: bash
        env:
          OPENCODE_VERSION_PIN: ${{ vars.OPENCODE_VERSION || '1.18.31' }}
        run: |
          set -euo pipefail
          json="$(mktemp)"
          trap 'rm -f "$json"' EXIT
          if [[ -n "$OPENCODE_VERSION_PIN" ]]; then
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 \
              "https://api.github.com/repos/anomalyco/opencode/releases/tags/v$OPENCODE_VERSION_PIN" -o "$json"
          else
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 \
              https://api.github.com/repos/anomalyco/opencode/releases/latest -o "$json"
          fi
          tag="$(jq -r '.tag_name' "$json")"
          version="${tag#v}"
          url="$(jq -r '.assets[] | select(.name == "opencode-linux-x64.tar.gz") | .browser_download_url' "$json")"
          digest="$(jq -r '.assets[] | select(.name == "opencode-linux-x64.tar.gz") | .digest' "$json")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ -n "$url" && "$url" != "null" ]] || exit 1
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Verified OpenCode release: $version"

      - name: Restore verified OpenCode cache
        if: env.OC_TASK_MODE != 'merge'
        id: cache_restore
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ steps.opencode_release.outputs.version }}

      - name: Install OpenCode on cache miss
        if: env.OC_TASK_MODE != 'merge' && steps.cache_restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 5 --max-time 120 \
            "${{ steps.opencode_release.outputs.url }}" -o "$tmp/opencode.tar.gz"
          digest="${{ steps.opencode_release.outputs.digest }}"
          digest="${digest#sha256:}"
          echo "$digest  $tmp/opencode.tar.gz" | sha256sum --check -
          mkdir -p "$tmp/extract"
          tar -xzf "$tmp/opencode.tar.gz" -C "$tmp/extract"
          binary="$(find "$tmp/extract" -type f -name opencode -perm -u+x | head -n 1)"
          [[ -n "$binary" ]] || exit 1
          install -Dm755 "$binary" "$HOME/.opencode/bin/opencode"
          "$HOME/.opencode/bin/opencode" --version

      - name: Add OpenCode to PATH
        shell: bash
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Preflight credentials
        if: env.OC_TASK_MODE != 'merge'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$OPENCODE_API_KEY" ]] && echo "OpenCode Zen credential: configured" || echo "::warning title=OpenCode Zen unavailable::OPENCODE_API_KEY is not configured."
          [[ -n "$COPILOT_GITHUB_TOKEN" ]] && echo "Copilot fallback credential: configured" || echo "Copilot fallback credential: optional/unconfigured"
          [[ -n "$OPENROUTER_API_KEY" ]] && echo "OpenRouter recovery credential: configured" || echo "OpenRouter recovery credential: optional/unconfigured"
          [[ -n "$OPENCODE_API_KEY" || -n "$OPENROUTER_API_KEY" || -n "$COPILOT_GITHUB_TOKEN" ]] || {
            echo "::error title=No agent credential::Configure OPENCODE_API_KEY or COPILOT_GITHUB_TOKEN."
            exit 1
          }
          [[ -n "$COMPOSIO_API_KEY" ]] && echo "Composio MCP credential: configured" || echo "::warning title=Composio unavailable::COMPOSIO_API_KEY is not configured."
          [[ -n "${UNIVERSAL_TOKEN:-}" ]] && echo "Universal GitHub credential: configured" || echo "Universal GitHub credential: not configured; using the workflow GitHub token."
          echo "Zen free model candidates: $OPENCODE_ZEN_FREE_MODELS"

      - name: Prepare peer credential file
        if: env.OC_TASK_MODE != 'merge'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          peer_token_file="$RUNNER_TEMP/copilot-peer-token"
          if [[ -n "${COPILOT_GITHUB_TOKEN:-}" ]]; then
            printf '%s' "$COPILOT_GITHUB_TOKEN" > "$peer_token_file"
            chmod 600 "$peer_token_file"
            echo "COPILOT_PEER_TOKEN_FILE=$peer_token_file" >> "$GITHUB_ENV"
          else
            rm -f "$peer_token_file"
            echo "COPILOT_PEER_TOKEN_FILE=" >> "$GITHUB_ENV"
          fi

      - name: Prepare remote target workspace
        if: steps.target.outputs.mode == 'remote'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UNIVERSAL_TOKEN || github.token }}
          OC_CONTROLLER_ROOT: ${{ github.workspace }}
        run: bash .github/scripts/prepare-oc-target.sh

      - name: Bootstrap Composio session MCP
        if: env.OC_TASK_MODE != 'merge'
        continue-on-error: true
        id: composio_session
        shell: bash
        run: bash .github/scripts/prepare-composio-mcp.sh

      - name: Select route 1
        id: route_1
        if: env.OC_TASK_MODE != 'merge'
        shell: bash
        run: bash .github/scripts/select-opencode-route.sh

      - name: Attempt 1
        id: attempt_1
        if: env.OC_TASK_MODE != 'merge' && steps.route_1.outputs.selected == 'true'
        continue-on-error: true
        uses: ./.github/actions/oc-attempt
        with:
          attempt: "1"
          provider: ${{ steps.route_1.outputs.provider }}
          model: ${{ env.OPENCODE_SELECTED_MODEL }}
          target_number: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          base_ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          initial_sha: ${{ steps.initial_state.outputs.sha }}
          mode: ${{ steps.target.outputs.mode }}
          task_mode: ${{ steps.task_mode.outputs.mode }}
          verify_wait_minutes: "20"
          verify_poll_seconds: "20"

      - name: Select route 2
        id: route_2
        if: |
          env.OC_TASK_MODE == 'code' &&
          steps.attempt_1.outputs.agent_outcome == 'failure' &&
          steps.attempt_1.outputs.durable_work != 'true' &&
          steps.attempt_1.outputs.termination_reason != 'timeout' &&
          steps.attempt_1.outputs.termination_reason != 'signal' &&
          steps.attempt_1.outputs.classify_outcome == 'success' &&
          steps.attempt_1.outputs.result_state != 'published-after-provider-warning'
        shell: bash
        run: bash .github/scripts/select-opencode-route.sh

      - name: Attempt 2
        id: attempt_2
        if: env.OC_TASK_MODE != 'merge' && steps.route_2.outputs.selected == 'true'
        continue-on-error: true
        uses: ./.github/actions/oc-attempt
        with:
          attempt: "2"
          provider: ${{ steps.route_2.outputs.provider }}
          model: ${{ env.OPENCODE_SELECTED_MODEL }}
          target_number: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          base_ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          initial_sha: ${{ steps.initial_state.outputs.sha }}
          mode: ${{ steps.target.outputs.mode }}
          task_mode: ${{ steps.task_mode.outputs.mode }}
          verify_wait_minutes: "20"
          verify_poll_seconds: "20"

      - name: Select route 3
        id: route_3
        if: |
          env.OC_TASK_MODE == 'code' &&
          steps.attempt_2.outputs.agent_outcome == 'failure' &&
          steps.attempt_2.outputs.durable_work != 'true' &&
          steps.attempt_2.outputs.termination_reason != 'timeout' &&
          steps.attempt_2.outputs.termination_reason != 'signal' &&
          steps.attempt_2.outputs.classify_outcome == 'success' &&
          steps.attempt_2.outputs.result_state != 'published-after-provider-warning'
        shell: bash
        run: bash .github/scripts/select-opencode-route.sh

      - name: Attempt 3
        id: attempt_3
        if: env.OC_TASK_MODE != 'merge' && steps.route_3.outputs.selected == 'true'
        continue-on-error: true
        uses: ./.github/actions/oc-attempt
        with:
          attempt: "3"
          provider: ${{ steps.route_3.outputs.provider }}
          model: ${{ env.OPENCODE_SELECTED_MODEL }}
          target_number: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          base_ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          initial_sha: ${{ steps.initial_state.outputs.sha }}
          mode: ${{ steps.target.outputs.mode }}
          task_mode: ${{ steps.task_mode.outputs.mode }}
          verify_wait_minutes: "20"
          verify_poll_seconds: "20"

      - name: OpenCode success inspection
        if: always() && ((steps.attempt_1.outputs.agent_outcome == 'success' && steps.attempt_1.outputs.publish_outcome != 'failed' && steps.route_1.outputs.provider == 'opencode') || (steps.attempt_2.outputs.agent_outcome == 'success' && steps.attempt_2.outputs.publish_outcome != 'failed' && steps.route_2.outputs.provider == 'opencode') || (steps.attempt_3.outputs.agent_outcome == 'success' && steps.attempt_3.outputs.publish_outcome != 'failed' && steps.route_3.outputs.provider == 'opencode'))
        shell: bash
        run: |
          set -euo pipefail
          echo "OpenCode completed successfully."
          git status --short
          git branch --show-current
          git log -1 --oneline

      - name: Reconcile OpenCode publication
        if: always() && env.OC_PUBLISH_REQUESTED == 'true' && env.OC_TASK_MODE != 'report' && steps.target.outputs.mode != 'remote' && ((steps.attempt_1.outputs.agent_outcome == 'success' && steps.attempt_1.outputs.publish_outcome != 'failed' && steps.route_1.outputs.provider == 'opencode') || (steps.attempt_2.outputs.agent_outcome == 'success' && steps.attempt_2.outputs.publish_outcome != 'failed' && steps.route_2.outputs.provider == 'opencode') || (steps.attempt_3.outputs.agent_outcome == 'success' && steps.attempt_3.outputs.publish_outcome != 'failed' && steps.route_3.outputs.provider == 'opencode'))
        env:
          GH_TOKEN: ${{ secrets.UNIVERSAL_TOKEN || github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        shell: bash
        run: bash .github/scripts/reconcile-opencode-result.sh

      - name: Post controlled timeout continuation
        continue-on-error: true
        if: always() && (steps.attempt_1.outputs.termination_reason == 'timeout' || steps.attempt_2.outputs.termination_reason == 'timeout' || steps.attempt_3.outputs.termination_reason == 'timeout' || steps.attempt_1.outputs.timed_out == 'true' || steps.attempt_2.outputs.timed_out == 'true' || steps.attempt_3.outputs.timed_out == 'true')
        env:
          GH_TOKEN: ${{ secrets.UNIVERSAL_TOKEN || github.token }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          OPENCODE_AGENT_TIMEOUT_MINUTES: "350"
        shell: bash
        run: bash .github/scripts/post-oc-continuation.sh

      - name: Human handoff after exhausted or blocked recovery
        if: always() && steps.attempt_1.outputs.agent_outcome == 'failure' && steps.attempt_1.outputs.durable_work != 'true' && (steps.attempt_3.outputs.agent_outcome != 'success') && steps.attempt_1.outputs.termination_reason != 'timeout' && steps.attempt_2.outputs.termination_reason != 'timeout' && steps.attempt_3.outputs.termination_reason != 'timeout'
        env:
          GH_TOKEN: ${{ secrets.UNIVERSAL_TOKEN || github.token }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          SAFE_LOG: ${{ steps.attempt_3.outputs.safe_log_path || steps.attempt_2.outputs.safe_log_path || steps.attempt_1.outputs.safe_log_path }}
        shell: bash
        run: |
          set -euo pipefail
          findings="$(tail -n 100 "$SAFE_LOG" 2>/dev/null || printf '%s' 'No sanitized agent log was available.')"
          body="$(printf 'Agent recovery stopped without a fully verified success. No success is claimed.\n\nSanitized findings:\n\n%s' "$findings")"
          gh issue comment "$TARGET_NUMBER" --body "$body"

      - name: Autonomous CI recovery loop
        if: always() && env.OC_PUBLISH_REQUESTED == 'true' && env.OC_TASK_MODE != 'report' && (steps.attempt_1.outputs.agent_outcome == 'success' || steps.attempt_2.outputs.agent_outcome == 'success' || steps.attempt_3.outputs.agent_outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.UNIVERSAL_TOKEN || github.token }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          OC_RUN_START_ISO: ${{ env.OC_RUN_START_ISO }}
          OC_JOB_START_EPOCH: ${{ env.OC_JOB_START_EPOCH }}
          OC_JOB_BUDGET_SECONDS: "21600"
          OC_JOB_SAFETY_MARGIN_SECONDS: "120"
          OC_ISSUE_CONTEXT_FILE: ${{ env.OC_ISSUE_CONTEXT_FILE }}
          OC_MAX_RECOVERY_ROUNDS: "5"
          OC_CI_WATCH_MINUTES: "45"
          OC_CI_WATCH_POLL_SECONDS: "20"
        shell: bash
        run: bash .github/scripts/recover-opencode-ci.sh

      - name: Independent agent audit (advisory)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.UNIVERSAL_TOKEN || github.token }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          OC_RUN_START_ISO: ${{ env.OC_RUN_START_ISO }}
        shell: bash
        run: bash .github/scripts/independent-audit-advisory.sh

      - name: Post concise /oc result
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TASK_MODE: ${{ env.OC_TASK_MODE }}
          OC_TARGET_MODE: ${{ steps.target.outputs.mode }}
          OC_TARGET_REPO: ${{ steps.target.outputs.target_repo }}
          OC_TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
          A1: ${{ steps.attempt_1.outputs.agent_outcome }}
          P1: ${{ steps.attempt_1.outputs.publish_outcome }}
          V1: ${{ steps.attempt_1.outputs.verified }}
          PR1: ${{ steps.attempt_1.outputs.pr_url }}
          SHA1: ${{ steps.attempt_1.outputs.verified_sha }}
          A2: ${{ steps.attempt_2.outputs.agent_outcome }}
          P2: ${{ steps.attempt_2.outputs.publish_outcome }}
          V2: ${{ steps.attempt_2.outputs.verified }}
          PR2: ${{ steps.attempt_2.outputs.pr_url }}
          SHA2: ${{ steps.attempt_2.outputs.verified_sha }}
          A3: ${{ steps.attempt_3.outputs.agent_outcome }}
          P3: ${{ steps.attempt_3.outputs.publish_outcome }}
          V3: ${{ steps.attempt_3.outputs.verified }}
          PR3: ${{ steps.attempt_3.outputs.pr_url }}
          SHA3: ${{ steps.attempt_3.outputs.verified_sha }}
          MERGE_REQUESTED: ${{ env.OC_MERGE_REQUESTED }}
          MERGE_EXIT: ${{ env.OC_MERGE_EXIT }}
        run: bash .github/scripts/post-oc-result.sh

      - name: Routing summary
        if: always()
        env:
          R1: ${{ steps.route_1.outputs.route }}
          R2: ${{ steps.route_2.outputs.route }}
          R3: ${{ steps.route_3.outputs.route }}
          A1: ${{ steps.attempt_1.outputs.agent_outcome }}
          A2: ${{ steps.attempt_2.outputs.agent_outcome }}
          A3: ${{ steps.attempt_3.outputs.agent_outcome }}
          P1: ${{ steps.attempt_1.outputs.publish_outcome }}
          P2: ${{ steps.attempt_2.outputs.publish_outcome }}
          P3: ${{ steps.attempt_3.outputs.publish_outcome }}
          V1: ${{ steps.attempt_1.outputs.verified }}
          V2: ${{ steps.attempt_2.outputs.verified }}
          V3: ${{ steps.attempt_3.outputs.verified }}
        run: |
          {
            echo "### /oc hybrid agent routing"
            echo ""
            echo "| Attempt | Route | Agent | Publish | Verified |"
            echo "|---|---|---|---|---|"
            echo "| 1 | ${R1:-not selected} | ${A1:-not run} | ${P1:-n/a} | ${V1:-n/a} |"
            echo "| 2 | ${R2:-not selected} | ${A2:-not run} | ${P2:-n/a} | ${V2:-n/a} |"
            echo "| 3 | ${R3:-not selected} | ${A3:-not run} | ${P3:-n/a} | ${V3:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Final status
        if: always()
        env:
          A1: ${{ steps.attempt_1.outputs.agent_outcome }}
          A2: ${{ steps.attempt_2.outputs.agent_outcome }}
          A3: ${{ steps.attempt_3.outputs.agent_outcome }}
          R1: ${{ steps.route_1.outputs.provider }}
          R2: ${{ steps.route_2.outputs.provider }}
          R3: ${{ steps.route_3.outputs.provider }}
          P1: ${{ steps.attempt_1.outputs.publish_outcome }}
          P2: ${{ steps.attempt_2.outputs.publish_outcome }}
          P3: ${{ steps.attempt_3.outputs.publish_outcome }}
          V1: ${{ steps.attempt_1.outputs.verified }}
          V2: ${{ steps.attempt_2.outputs.verified }}
          V3: ${{ steps.attempt_3.outputs.verified }}
          DW1: ${{ steps.attempt_1.outputs.durable_work }}
          DW2: ${{ steps.attempt_2.outputs.durable_work }}
          DW3: ${{ steps.attempt_3.outputs.durable_work }}
          TASK_MODE: ${{ env.OC_TASK_MODE }}
          MERGE_REQUESTED: ${{ env.OC_MERGE_REQUESTED }}
          MERGE_EXIT: ${{ env.OC_MERGE_EXIT }}

        run: |
          set -euo pipefail
          success=false
          if [[ "$MERGE_REQUESTED" == "true" ]]; then
            [[ "$MERGE_EXIT" == "0" ]] && success=true
          elif [[ "$TASK_MODE" == "report" ]]; then
            [[ "$A1" == "success" ]] && success=true
          else
            if [[ "$A1" == "success" && "$P1" != "failed" ]] || [[ "$A2" == "success" && "$P2" != "failed" ]] || [[ "$A3" == "success" && "$P3" != "failed" ]]; then success=true; fi
            if [[ "$DW1" == "true" || "$DW2" == "true" || "$DW3" == "true" ]]; then success=true; fi
          fi
          if [[ "$success" == "true" ]]; then
            if [[ "$DW1" == "true" || "$DW2" == "true" || "$DW3" == "true" ]] && [[ "$A1" != "success" && "$A2" != "success" && "$A3" != "success" ]]; then
              echo "Durable progress checkpointed; no duplicate fallback started. Use /oc continue."
            else
              echo "OpenCode control-plane operation completed."
            fi
            exit 0
          fi
          echo "::error title=Agent operation not completed::No successful completion or durable checkpoint was produced."
          exit 1
      - name: Persist session milestone
        if: always() && env.OC_SESSION_REQUIRED == 'true' && env.OC_TASK_MODE == 'code'
        continue-on-error: true
        shell: bash
        env:
          DW1: ${{ steps.attempt_1.outputs.durable_work }}
          DW2: ${{ steps.attempt_2.outputs.durable_work }}
          DW3: ${{ steps.attempt_3.outputs.durable_work }}
          A1: ${{ steps.attempt_1.outputs.agent_outcome }}
          A2: ${{ steps.attempt_2.outputs.agent_outcome }}
          A3: ${{ steps.attempt_3.outputs.agent_outcome }}
        run: |
          set -euo pipefail
          durable=false
          [[ "$DW1" == "true" || "$DW2" == "true" || "$DW3" == "true" ]] && durable=true
          phase=blocked
          status=active
          next="inspect the durable branch and continue"
          if [[ "$durable" == "true" ]]; then phase=checkpointed; next="resume with /oc continue"; fi
          if [[ "$A1" == "success" || "$A2" == "success" || "$A3" == "success" ]]; then phase=completed; status=complete; next="await user direction"; fi
          OC_DURABLE_WORK="$durable" OC_SESSION_PHASE="$phase" OC_SESSION_STATUS="$status" OC_SESSION_NEXT_ACTION="$next" bash .github/scripts/record-oc-session-progress.sh || true

      - name: Record /oc run observability record
        if: always()
        continue-on-error: true
        shell: bash
        env:
          OC_OBS_RUN_ID: ${{ github.run_id }}
          OC_OBS_ISSUE: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          OC_OBS_MODE: ${{ steps.target.outputs.mode }}
          OC_OBS_TASK_MODE: ${{ steps.task_mode.outputs.mode }}
          OC_OBS_PEER1: ${{ steps.attempt_1.outputs.copilot_peer_result }}
          OC_OBS_PEER1_ELAPSED: ${{ steps.attempt_1.outputs.copilot_peer_elapsed_seconds }}
          OC_OBS_PEER1_ROUNDS: ${{ steps.attempt_1.outputs.copilot_peer_rounds_used }}
          OC_OBS_VERSION: ${{ steps.opencode_release.outputs.version }}
          OC_OBS_INITIAL_SHA: ${{ steps.initial_state.outputs.sha }}
          OC_OBS_TARGET_REPO: ${{ steps.target.outputs.target_repo }}
          OC_OBS_TARGET_BASE: ${{ steps.target.outputs.target_base }}
          OC_OBS_TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
          OC_OBS_R1: ${{ steps.route_1.outputs.route }}
          OC_OBS_R1_PROVIDER: ${{ steps.route_1.outputs.provider }}
          OC_OBS_A1: ${{ steps.attempt_1.outputs.agent_outcome }}
          OC_OBS_PU1: ${{ steps.attempt_1.outputs.publish_outcome }}
          OC_OBS_C1: ${{ steps.attempt_1.outputs.classify_outcome }}
          OC_OBS_V1: ${{ steps.attempt_1.outputs.verified }}
          OC_OBS_R2: ${{ steps.route_2.outputs.route }}
          OC_OBS_R2_PROVIDER: ${{ steps.route_2.outputs.provider }}
          OC_OBS_A2: ${{ steps.attempt_2.outputs.agent_outcome }}
          OC_OBS_PU2: ${{ steps.attempt_2.outputs.publish_outcome }}
          OC_OBS_C2: ${{ steps.attempt_2.outputs.classify_outcome }}
          OC_OBS_V2: ${{ steps.attempt_2.outputs.verified }}
          OC_OBS_R3: ${{ steps.route_3.outputs.route }}
          OC_OBS_R3_PROVIDER: ${{ steps.route_3.outputs.provider }}
          OC_OBS_A3: ${{ steps.attempt_3.outputs.agent_outcome }}
          OC_OBS_PU3: ${{ steps.attempt_3.outputs.publish_outcome }}
          OC_OBS_C3: ${{ steps.attempt_3.outputs.classify_outcome }}
          OC_OBS_V3: ${{ steps.attempt_3.outputs.verified }}
          OC_OBS_VERIFIED_SHA: ${{ steps.attempt_1.outputs.verified_sha || steps.attempt_2.outputs.verified_sha || steps.attempt_3.outputs.verified_sha }}
          OC_OBS_PR_URL: ${{ steps.attempt_1.outputs.pr_url || steps.attempt_2.outputs.pr_url || steps.attempt_3.outputs.pr_url }}
          OC_OBS_CI_RUN_ID: ${{ steps.attempt_1.outputs.ci_run_id || steps.attempt_2.outputs.ci_run_id || steps.attempt_3.outputs.ci_run_id }}
          OC_OBS_CI_SURFACES: ${{ steps.attempt_1.outputs.ci_surfaces || steps.attempt_2.outputs.ci_surfaces || steps.attempt_3.outputs.ci_surfaces }}
        run: bash .github/scripts/write-oc-run-record.sh

      - name: Upload /oc session context artifact
        if: always() && env.OC_SESSION_REQUIRED == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: oc-session-context-${{ github.run_id }}
          path: |
            ${{ env.OC_SESSION_STATE_FILE }}
            ${{ env.OC_ISSUE_CONTEXT_SEED_FILE }}
            ${{ env.OC_ISSUE_CONTEXT_INDEX_FILE }}
            ${{ env.OC_REFERENCE_CONTEXT_FILE }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload /oc run record artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: oc-run-record-${{ github.run_id }}
          path: docs/oc-runs/${{ github.run_id }}.json
          if-no-files-found: ignore
          retention-days: 365

      - name: Clean up remote target workspace
        if: always()
        continue-on-error: true
        shell: bash
        env:
          OC_TARGET_WORKSPACE: ${{ env.OC_TARGET_WORKSPACE }}
        run: |
          set -euo pipefail
          ws="${OC_TARGET_WORKSPACE:-}"
          if [[ -z "$ws" ]]; then
            echo "No remote target workspace to clean up."
            exit 0
          fi
          if [[ -e "$ws" ]] && [[ "$ws" == /home/runner/work/_temp/* || "$ws" == /tmp/* ]]; then
            workdir="$(dirname "$ws")"
            rm -rf "$workdir"
            echo "Removed remote target workspace: $workdir"
          else
            echo "::error title=Remote workspace cleanup skipped::Workspace path $ws is outside the allowed temporary directories."
            exit 1
          fi

      - name: Clean up Composio session MCP
        if: always()
        continue-on-error: true
        env:
          SESSION_ID: ${{ steps.composio_session.outputs.session_id }}
          HEADERS_FILE: ${{ steps.composio_session.outputs.headers_file }}
        run: bash .github/scripts/cleanup-composio-mcp.sh

      - name: Clear /oc running reaction
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/oc-running-reaction.sh remove

  retry-failed-jobs:
    # Control lane merged from the former oc-control.yml so that a single
    # workflow owns every issue_comment trigger. Its own per-issue group keeps
    # the lane disjoint from the agent lane, preserving serialization while
    # eliminating the duplicate workflow run that oc-control.yml created per
    # comment (which raced the agent lane and sometimes queued as "pending").
    concurrency:
      group: oc-retry-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    if: |
      github.event.comment.user.login == github.repository_owner &&
      (
        startsWith(github.event.comment.body, '/oc retry failed jobs') ||
        startsWith(github.event.comment.body, '/opencode retry failed jobs')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ secrets.UNIVERSAL_TOKEN || github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Execute selective failed-job retry
        shell: bash
        run: bash .github/scripts/retry-oc-failed-jobs.sh
