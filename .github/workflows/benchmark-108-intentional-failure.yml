name: benchmark-108-intentional-failure

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Intentional benchmark failure
        shell: bash
        run: |
          echo "::error title=Benchmark intentional failure::This is a controlled CI failure for benchmark issue #108"
          exit 1
