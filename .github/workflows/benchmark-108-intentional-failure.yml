name: benchmark-108-intentional-failure

# TEMPORARY benchmark-only workflow for issue #108 (ULTIMATE two-brain CI
# recovery benchmark). This intentionally fails so the agent can observe the
# real remote GitHub Actions failure log and then repair it on the same branch.
# It is removed again before the PR is finalized. It exists ONLY to be broken;
# it must never be used for any production purpose.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  intentional-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Intentional benchmark-only failure
        shell: bash
        run: |
          echo "::error title=benchmark-108-intentional-failure::Deliberate temporary CI failure for issue #108 benchmark log observation"
          echo "This step fails on purpose so the agent can capture the real remote"
          echo "GitHub Actions failure log for the exact PR head SHA, then remove this"
          echo "workflow and re-observe the same PR going green."
          exit 1