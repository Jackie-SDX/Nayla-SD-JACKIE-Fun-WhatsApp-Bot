name: opencode-cache

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

concurrency:
  group: opencode-cache
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify pinned OpenCode V2 package
        id: runtime
        env:
          OPENCODE_V2_VERSION: "0.0.0-beta-19723"
        shell: bash
        run: |
          set -euo pipefail
          npm view "@opencode-ai/cli@${OPENCODE_V2_VERSION}" version --json | jq -e --arg v "$OPENCODE_V2_VERSION" '. == $v' >/dev/null
          echo "Verified OpenCode V2 package: $OPENCODE_V2_VERSION"

      - name: Restore OpenCode V2 cache
        id: cache_restore
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.opencode2
          key: opencode2-${{ runner.os }}-${{ runner.arch }}-0.0.0-beta-19723

      - name: Install OpenCode V2 on cache miss
        if: steps.cache_restore.outputs.cache-hit != 'true'
        env:
          OPENCODE_V2_VERSION: "0.0.0-beta-19723"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/.opencode2"
          npm install --prefix "$HOME/.opencode2" --no-audit --no-fund --prefer-online --save-exact "@opencode-ai/cli@${OPENCODE_V2_VERSION}"
          test -x "$HOME/.opencode2/bin/opencode2"
          actual="$("$HOME/.opencode2/bin/opencode2" --version)"
          echo "OpenCode V2 runtime: $actual"
          [[ "$actual" == *"$OPENCODE_V2_VERSION"* ]]

      - name: Save verified OpenCode V2 cache
        if: steps.cache_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.opencode2
          key: opencode2-${{ runner.os }}-${{ runner.arch }}-0.0.0-beta-19723
