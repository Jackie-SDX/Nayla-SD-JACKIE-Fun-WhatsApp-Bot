name: enterprise-agent-validation

on:
  push:
    branches:
      - 'audit/**'
      - 'feature/**'
      - 'fix/**'
      - 'oc/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: enterprise-agent-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate files and syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in opencode.json .github/workflows/opencode.yml .github/workflows/opencode-cache.yml .github/workflows/oc-control.yml .github/scripts/select-opencode-route.sh .github/scripts/run-opencode-attempt.sh .github/scripts/run-copilot-attempt.sh .github/scripts/publish-copilot-change.sh .github/scripts/classify-provider-failure.sh .github/scripts/prepare-composio-mcp.sh .github/scripts/cleanup-composio-mcp.sh .github/scripts/post-oc-continuation.sh .github/scripts/reconcile-opencode-result.sh .github/scripts/verify-agent-result.sh .github/scripts/oc-publish-lib.sh .github/scripts/resolve-oc-target.sh .github/scripts/prepare-oc-target.sh .github/scripts/publish-remote-opencode.sh .github/scripts/test-oc-target.sh .opencode/agents/critic.md .opencode/instructions.md .github/copilot-instructions.md .github/dependabot.yml .github/CODEOWNERS docs/ENTERPRISE_AGENT_AUDIT.md docs/GITHUB_NATIVE_COPILOT_AUDIT.md docs/HYBRID_AGENT_ARCHITECTURE_AUDIT.md; do
            test -f "$f"
          done
          jq empty opencode.json
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml",".github/dependabot.yml"].uniq.each { |f| YAML.load_file(f); puts "YAML OK: #{f}" }'
          bash -n .github/scripts/select-opencode-route.sh
          bash -n .github/scripts/run-opencode-attempt.sh
          bash -n .github/scripts/run-copilot-attempt.sh
          bash -n .github/scripts/publish-copilot-change.sh
          bash -n .github/scripts/classify-provider-failure.sh
          bash -n .github/scripts/prepare-composio-mcp.sh
          bash -n .github/scripts/cleanup-composio-mcp.sh
          bash -n .github/scripts/post-oc-continuation.sh
          bash -n .github/scripts/reconcile-opencode-result.sh
          bash -n .github/scripts/verify-agent-result.sh
          bash -n .github/scripts/oc-publish-lib.sh
          bash -n .github/scripts/resolve-oc-target.sh
          bash -n .github/scripts/prepare-oc-target.sh
          bash -n .github/scripts/publish-remote-opencode.sh
          bash -n .github/scripts/test-oc-target.sh
          jq empty package.json

      - name: Run application test suite
        shell: bash
        run: npm test

      - name: Validate hybrid architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          wf=Path(".github/workflows/opencode.yml").read_text()
          cfg=json.loads(Path("opencode.json").read_text())
          prep=Path(".github/scripts/prepare-composio-mcp.sh").read_text()
          ins=Path(".opencode/instructions.md").read_text()
          runner=Path(".github/scripts/run-opencode-attempt.sh").read_text()
          selector=Path(".github/scripts/select-opencode-route.sh").read_text()
          critic=Path(".opencode/agents/critic.md").read_text()
          cont=Path(".github/scripts/post-oc-continuation.sh").read_text()
          recon=Path(".github/scripts/reconcile-opencode-result.sh").read_text()
          assert "OPENCODE_API_KEY" in wf
          assert "COMPOSIO_API_KEY" in wf
          assert "COMPOSIO_USER_ID:" in wf
          assert "secrets.UNIVERSAL_TOKEN" in wf
          assert "actions: write" in wf
          assert "checks: read" in wf
          assert "statuses: read" in wf
          assert "contents: write" in wf
          assert "issues: write" in wf
          assert "pull-requests: write" in wf
          assert "timeout-minutes: 360" in wf
          assert "OPENCODE_AGENT_TIMEOUT_MINUTES" in wf
          assert "post-oc-continuation.sh" in wf
          assert "reconcile-opencode-result.sh" in wf
          assert "termination_reason != 'timeout'" in wf
          assert "timeout --signal=TERM" in runner
          assert "opencode github run" in runner
          assert "github-copilot/auto" in selector
          assert cfg["mcp"]["composio"]["type"]=="local"
          assert cfg["mcp"]["composio"]["enabled"] is True
          assert "mcp-remote@0.14.2" in cfg["mcp"]["composio"]["command"]
          assert "continuing without Composio tools" in prep
          assert "Replay safety gate" not in wf
          assert "steps.replay_2" not in wf
          assert "steps.replay_3" not in wf
          assert "steps.agent_1.outcome == 'failure'" in wf
          assert "steps.agent_2.outcome == 'failure'" in wf
          assert "steps.classify_1.outcome == 'success'" in wf
          assert "steps.classify_2.outcome == 'success'" in wf
          assert "advance_route" in Path(".github/scripts/classify-provider-failure.sh").read_text()
          assert "termination_reason" in runner
          assert "evidence ledger" in ins
          assert "/oc continue" in ins
          assert "/oc retry failed jobs" in ins
          assert ".opencode/agents/critic.md" in ins
          assert "read-only adversarial verifier" in critic.lower()
          assert "bash: deny" in critic
          assert "gh issue comment" in cont
          assert "merged_same_head" in recon
          assert "three-strike" not in ins
          assert "up to five total evidence-based forensic recovery cycles" not in ins
          print("continuous-agent contract: OK")
          PY

      - name: Validate remote-target control plane
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/opencode.yml").read_text()
          resolver=Path(".github/scripts/resolve-oc-target.sh").read_text()
          prepare=Path(".github/scripts/prepare-oc-target.sh").read_text()
          publisher=Path(".github/scripts/publish-remote-opencode.sh").read_text()
          verifier=Path(".github/scripts/verify-agent-result.sh").read_text()
          lib=Path(".github/scripts/oc-publish-lib.sh").read_text()
          cont=Path(".github/scripts/post-oc-continuation.sh").read_text()
          runner=Path(".github/scripts/run-opencode-attempt.sh").read_text()
          assert "resolve-oc-target.sh" in wf
          assert "id: target" in wf
          assert "prepare-oc-target.sh" in wf
          assert "publish-remote-opencode.sh" in wf
          assert "Clean up remote target workspace" in wf
          assert "OC_TARGET_MODE" in resolver
          assert "OPENCODE_EXCLUDED_PROVIDERS" in resolver and "github-copilot" in resolver
          assert "oc-target-repo:" in cont
          assert "OC_TARGET_WORKSPACE" in prepare
          assert "oc_guard_repo_publication" in lib
          assert "160000" in lib
          assert "refusing to publish" in lib.lower()
          assert "opencode github run" in runner
          print("remote-target contract files: OK")
          PY
          bash .github/scripts/test-oc-target.sh

      - name: Validate Zen configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          cfg=json.loads(Path("opencode.json").read_text())
          bash=cfg["permission"]["bash"]
          assert cfg["model"]=="opencode/big-pickle"
          assert cfg["share"]=="disabled"
          assert cfg["permission"]["external_directory"]=="deny"
          assert cfg["permission"]["doom_loop"]=="allow"
          assert "git commit *" not in bash
          assert "git commit" not in bash
          assert "git push *" not in bash
          assert "git push" not in bash
          assert bash["git reset *"]=="deny"
          assert bash["git clean *"]=="deny"
          print("agent permissions: OK")
          PY

      - name: Validate route selector structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess, tempfile
          wf=Path(".github/workflows/opencode-cache.yml").read_text()
          route=Path(".github/scripts/select-opencode-route.sh").read_text()
          assert "OPENCODE_ROUTE_INDEX" in route
          assert "OPENCODE_EXCLUDED_PROVIDERS" in route
          assert "is_free_model" in route
          assert "github-copilot/auto" in route
          assert "opencode/" in route
          assert "2.0.3" not in wf
          assert "OpenCode V2" not in wf
          def pick(route_index, copilot):
            d=tempfile.mkdtemp()
            env=dict(os.environ)
            env.pop("COPILOT_GITHUB_TOKEN",None)
            env.pop("OPENCODE_EXCLUDED_PROVIDERS",None)
            env.update(OPENCODE_API_KEY="x", OPENCODE_ZEN_FREE_MODELS="big-pickle,mimo-v2.5-free",
                     OPENCODE_ROUTE_INDEX=route_index, GITHUB_ENV=os.path.join(d,"env"),
                     GITHUB_OUTPUT=os.path.join(d,"out"))
            if copilot:
              env["COPILOT_GITHUB_TOKEN"]=copilot
            subprocess.run(["bash",".github/scripts/select-opencode-route.sh"],env=env,check=True,capture_output=True,text=True)
            return Path(os.path.join(d,"out")).read_text()
          assert "route=opencode/big-pickle" in pick("",None)
          assert "route=opencode/mimo-v2.5-free" in pick("1",None)
          assert "route=github-copilot/auto" in pick("2","y")
          assert "route=none" in pick("2",None)
          assert "route=none" in pick("3","y")
          print("routing/cache contract: OK")
          print("model ladder (big-pickle->mimo->copilot->none): OK")
          PY

      - name: Validate enterprise recovery controls
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/oc-control.yml
          test -f .github/scripts/retry-oc-failed-jobs.sh
          test -f .github/scripts/verify-agent-result.sh
          grep -Fq 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' .github/workflows/oc-control.yml
          grep -Fq 'rerun-failed-jobs' .github/scripts/retry-oc-failed-jobs.sh
          grep -Fq 'already received a selective failed-job rerun' .github/scripts/retry-oc-failed-jobs.sh
          grep -Fq "!startsWith(github.event.comment.body, '/oc retry failed jobs')" .github/workflows/opencode.yml
          grep -Fq "!startsWith(github.event.comment.body, '/opencode retry failed jobs')" .github/workflows/opencode.yml
          grep -Fq "github.event.comment.user.type == 'User'" .github/workflows/opencode.yml
          grep -Fq 'github.event.comment.user.login == github.repository_owner' .github/workflows/opencode.yml
          grep -Fq 'oc-run-id' .github/workflows/opencode.yml
          grep -Fq 'OC_RUN_START_ISO' .github/workflows/opencode.yml
          grep -Fq 'commits/$head_sha/check-runs' .github/scripts/verify-agent-result.sh
          grep -Fq 'EXPECTED_TARGET_HEAD' .github/scripts/verify-agent-result.sh
          grep -Fq 'branch head ($branch_sha) does not match target PR head' .github/scripts/verify-agent-result.sh
          grep -Fq 'failure_count' .github/scripts/verify-agent-result.sh
          grep -Fq 'OC_CI_VERIFY_WAIT_MINUTES' .github/scripts/verify-agent-result.sh
          grep -Fq 'OPENCODE_RETRY_CURRENT_ROUTE' .github/scripts/select-opencode-route.sh
          grep -Fq 'zero process exit' .opencode/instructions.md
          echo 'enterprise recovery controls: OK'

