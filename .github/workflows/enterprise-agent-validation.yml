      - name: Validate route selector structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess, tempfile
          wf=Path(".github/workflows/opencode-cache.yml").read_text()
          route=Path(".github/scripts/select-opencode-route.sh").read_text()
          assert "OPENCODE_ROUTE_INDEX" in route
          assert "OPENCODE_EXCLUDED_PROVIDERS" in route
          assert "is_free_model" in route
          assert "github-copilot/auto" in route
          assert "opencode/" in route
          assert "OPENCODE_BAD_MODELS" in route
          assert "OPENCODE_BAD_MODELS_MAX_AGE_HOURS" in route
          assert "is_bad_model" in route
          assert "2.0.3" not in wf
          assert "OpenCode V2" not in wf
          def pick(route_index, copilot):
            d=tempfile.mkdtemp()
            env=dict(os.environ)
            env.pop("COPILOT_GITHUB_TOKEN",None)
            env.pop("OPENCODE_EXCLUDED_PROVIDERS",None)
            env.update(OPENCODE_API_KEY="x", OPENCODE_ZEN_FREE_MODELS="big-pickle,mimo-v2.6-flash-free",
                     OPENCODE_ROUTE_INDEX=route_index, GITHUB_ENV=os.path.join(d,"env"),
                     GITHUB_OUTPUT=os.path.join(d,"out"))
            if copilot:
              env["COPILOT_GITHUB_TOKEN"]=copilot
            subprocess.run(["bash",".github/scripts/select-opencode-route.sh"],env=env,check=True,capture_output=True,text=True)
            return Path(os.path.join(d,"out")).read_text()
          assert "route=opencode/big-pickle" in pick("",None)
          assert "route=opencode/mimo-v2.6-flash-free" in pick("1",None)
          assert "route=github-copilot/auto" in pick("2","y")
          assert "route=none" in pick("2",None)
          assert "route=none" in pick("3","y")
          # Legacy retry and the explicit advance flag must both move forward;
          # neither is allowed to restart the same model route.
          d=tempfile.mkdtemp()
          env=dict(os.environ)
          env.pop("COPILOT_GITHUB_TOKEN",None)
          env.update(OPENCODE_API_KEY="x", OPENCODE_ZEN_FREE_MODELS="big-pickle,mimo-v2.6-flash-free",
                     OPENCODE_ROUTE_INDEX="0", OPENCODE_RETRY_CURRENT_ROUTE="1",
                     GITHUB_ENV=os.path.join(d,"env"), GITHUB_OUTPUT=os.path.join(d,"out"))
          subprocess.run(["bash",".github/scripts/select-opencode-route.sh"],env=env,check=True,capture_output=True,text=True)
          assert "route=opencode/mimo-v2.6-flash-free" in Path(os.path.join(d,"out")).read_text()
          d=tempfile.mkdtemp()
          env=dict(os.environ)
          env.pop("COPILOT_GITHUB_TOKEN",None)
          env.update(OPENCODE_API_KEY="x", OPENCODE_ZEN_FREE_MODELS="big-pickle,mimo-v2.6-flash-free",
                     OPENCODE_ROUTE_INDEX="0", OPENCODE_ADVANCE_ROUTE="1",
                     GITHUB_ENV=os.path.join(d,"env"), GITHUB_OUTPUT=os.path.join(d,"out"))
          subprocess.run(["bash",".github/scripts/select-opencode-route.sh"],env=env,check=True,capture_output=True,text=True)
          assert "route=opencode/mimo-v2.6-flash-free" in Path(os.path.join(d,"out")).read_text()
          # Bad-model memory (audit item 6): a freshly recorded failed model is
          # skipped at index 0 so the next lane is selected; an expired entry
          # is ignored and the recorded model stays first. Only a fresh record
          # may change the ladder because a stale skip would trap the default.
          now=int(__import__("time").time())
          def pick_bad(entry):
            d=tempfile.mkdtemp()
            env=dict(os.environ)
            env.pop("COPILOT_GITHUB_TOKEN",None)
            env.update(OPENCODE_API_KEY="x", OPENCODE_ZEN_FREE_MODELS="big-pickle,mimo-v2.6-flash-free",
                       OPENCODE_ROUTE_INDEX="0", OPENCODE_BAD_MODELS=entry,
                       OPENCODE_BAD_MODELS_MAX_AGE_HOURS="24",
                       GITHUB_ENV=os.path.join(d,"env"), GITHUB_OUTPUT=os.path.join(d,"out"))
            subprocess.run(["bash",".github/scripts/select-opencode-route.sh"],env=env,check=True,capture_output=True,text=True)
            return Path(os.path.join(d,"out")).read_text(), Path(os.path.join(d,"env")).read_text()
          out_txt, env_txt = pick_bad("big-pickle=%d" % now)
          assert "route=opencode/mimo-v2.6-flash-free" in out_txt, "fresh bad-model must be skipped"
          assert "OPENCODE_ROUTE_INDEX=1" in env_txt, "ladder index must advance past a fresh bad-model"
          out_txt, env_txt = pick_bad("big-pickle=%d" % (now - 25*3600))
          assert "route=opencode/big-pickle" in out_txt, "expired bad-model must be ignored"
          assert "OPENCODE_ROUTE_INDEX=0" in env_txt, "expired bad-model must not move the ladder"
          print("routing/cache contract: OK")
          print("model ladder (big-pickle->mimo->copilot->none): OK")
          PY

