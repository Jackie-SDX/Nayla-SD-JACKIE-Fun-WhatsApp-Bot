name: enterprise-agent-validation

on:
  push:
    branches:
      - 'audit/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: enterprise-agent-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate files and syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in opencode.json .github/workflows/opencode.yml .github/workflows/opencode-cache.yml .github/scripts/select-opencode-route.sh .github/scripts/run-opencode-attempt.sh .github/scripts/run-opencode-council-stage.sh .github/scripts/run-copilot-attempt.sh .github/scripts/publish-opencode-change.sh .github/scripts/publish-copilot-change.sh .github/scripts/classify-provider-failure.sh .github/scripts/prepare-composio-mcp.sh .github/scripts/cleanup-composio-mcp.sh .github/scripts/validate-opencode-council.sh .github/scripts/validate-application.sh .opencode/instructions.md .opencode/agents/architect-reviewer.md .opencode/agents/adversarial-reviewer.md .opencode/agents/adjudicator.md .opencode/agents/verifier.md docs/AGENT_COUNCIL.md .github/copilot-instructions.md .github/dependabot.yml .github/CODEOWNERS docs/ENTERPRISE_AGENT_AUDIT.md docs/GITHUB_NATIVE_COPILOT_AUDIT.md docs/HYBRID_AGENT_ARCHITECTURE_AUDIT.md; do
            test -f "$f"
          done
          jq empty opencode.json
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml",".github/dependabot.yml"].uniq.each { |f| YAML.load_file(f); puts "YAML OK: #{f}" }'
          bash -n .github/scripts/select-opencode-route.sh
          bash -n .github/scripts/run-opencode-attempt.sh
          bash -n .github/scripts/run-opencode-council-stage.sh
          bash -n .github/scripts/publish-opencode-change.sh
          bash -n .github/scripts/run-copilot-attempt.sh
          bash -n .github/scripts/publish-copilot-change.sh
          bash -n .github/scripts/classify-provider-failure.sh
          bash -n .github/scripts/prepare-composio-mcp.sh
          bash -n .github/scripts/cleanup-composio-mcp.sh
          bash -n .github/scripts/validate-opencode-council.sh

      - name: Validate hybrid architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OPENCODE_API_KEY' .github/workflows/opencode.yml
          grep -q 'OPENCODE_ZEN_FREE_MODELS' .github/workflows/opencode.yml
          grep -q 'COMPOSIO_API_KEY' .github/workflows/opencode.yml
          grep -q 'COMPOSIO_USER_ID:' .github/workflows/opencode.yml
          grep -q 'prepare-composio-mcp.sh' .github/workflows/opencode.yml
          grep -q 'cleanup-composio-mcp.sh' .github/workflows/opencode.yml
          ! grep -A8 'Bootstrap Composio session MCP' .github/workflows/opencode.yml | grep -q 'continue-on-error: true'
          grep -q 'backend.composio.dev/api/v3.1/tool_router/session' .github/scripts/prepare-composio-mcp.sh
          grep -q 'mcp-remote@0.14.2' opencode.json
          grep -q 'http-only' opencode.json
          grep -q 'header-file' opencode.json
          jq -e '.mcp.composio.type == "local"' opencode.json >/dev/null
          jq -e '.mcp.composio.enabled == true' opencode.json >/dev/null
          grep -q 'COPILOT_GITHUB_TOKEN' .github/workflows/opencode.yml
          grep -q 'route_3' .github/workflows/opencode.yml
          grep -q 'three-strike' .opencode/instructions.md
          grep -q 'up to five total evidence-based forensic recovery cycles' .opencode/instructions.md
          grep -q 'OPENCODE_EXCLUDED_PROVIDERS' .github/scripts/classify-provider-failure.sh
          grep -q 'model-specific' .github/scripts/classify-provider-failure.sh
          ! grep -Eiq 'openrouter|huggingface|hugging-face|GEMINI_API_KEY' .github/workflows/opencode.yml .github/scripts/select-opencode-route.sh .github/scripts/run-opencode-attempt.sh
          ! grep -q 'anomalyco/opencode/github@latest' .github/workflows/opencode.yml
          ! grep -q 'actions/cache/save' .github/workflows/opencode.yml
          ! grep -q 'connect.composio.dev/mcp' .github/scripts/run-copilot-attempt.sh
          ! grep -q 'x-consumer-api-key' .github/scripts/run-copilot-attempt.sh
          ! grep -q 'id-token: write' .github/workflows/opencode.yml
          ! grep -q '^      GITHUB_TOKEN:' .github/workflows/opencode.yml
          grep -q 'Publish OpenCode attempt 1' .github/workflows/opencode.yml
          grep -q 'Publish OpenCode attempt 2' .github/workflows/opencode.yml
          grep -q 'Publish OpenCode attempt 3' .github/workflows/opencode.yml
          grep -q 'command_gate.outputs.valid' .github/workflows/opencode.yml
          grep -q 'COUNCIL_VERDICT' .github/scripts/run-opencode-attempt.sh
          grep -q 'git push --set-upstream origin' .github/scripts/publish-opencode-change.sh

      - name: Validate Zen configuration
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.model == "opencode/big-pickle"' opencode.json >/dev/null
          jq -e 'has("provider") | not' opencode.json >/dev/null
          jq -e '.permissions | type == "array"' opencode.json >/dev/null
          jq -e 'has("permission") | not' opencode.json >/dev/null
          jq -e '.permissions[] | select(.action=="subagent" and .resource=="*" and .effect=="deny")' opencode.json >/dev/null
          jq -e '.permissions[] | select(.action=="shell" and .resource=="git push *" and .effect=="deny")' opencode.json >/dev/null
          jq -e 'has("enabled_providers") | not' opencode.json >/dev/null
          jq -e '.share == "disabled"' opencode.json >/dev/null
          jq -e '.permissions[] | select(.action == "external_directory" and .resource == "*" and .effect == "deny")' opencode.json >/dev/null
          jq -e '.permissions[] | select(.action == "doom_loop" and .resource == "*" and .effect == "deny")' opencode.json >/dev/null
          jq -e '.permissions[] | select(.action == "shell" and .resource == "git commit *" and .effect == "deny")' opencode.json >/dev/null
          jq -e '.permissions[] | select(.action == "shell" and .resource == "git push *" and .effect == "deny")' opencode.json >/dev/null
          jq -e '.permissions[] | select(.action == "shell" and .resource == "git reset *" and .effect == "deny")' opencode.json >/dev/null
          jq -e '.permissions[] | select(.action == "shell" and .resource == "git clean *" and .effect == "deny")' opencode.json >/dev/null
          jq -e '.update == "disable"' opencode.json >/dev/null
          jq -e '.mcp.composio.type == "local"' opencode.json >/dev/null
          jq -e '.mcp.composio.enabled == true' opencode.json >/dev/null
          jq -e '.mcp.composio.timeout == 20000' opencode.json >/dev/null
          jq -e '.mcp.composio.command[0] == "npx"' opencode.json >/dev/null
          jq -e '.mcp.composio.command | index("mcp-remote@0.14.2") != null' opencode.json >/dev/null
          jq -e '.mcp.composio.command | index("--transport") != null' opencode.json >/dev/null
          jq -e '.mcp.composio.command | index("http-only") != null' opencode.json >/dev/null
          jq -e '.mcp.composio.command | index("--header-file") != null' opencode.json >/dev/null
          ! grep -q 'connect.composio.dev/mcp' opencode.json
          grep -q 'backend.composio.dev/api/v3.1/tool_router/session' .github/scripts/prepare-composio-mcp.sh
          grep -q 'x-api-key' .github/scripts/prepare-composio-mcp.sh
          grep -q 'mcp:true' .github/scripts/prepare-composio-mcp.sh
          ! grep -q 'connected_accounts' .github/scripts/prepare-composio-mcp.sh
          ! grep -q 'OPENCODE_CONFIG_CONTENT' .github/scripts/prepare-composio-mcp.sh
          grep -q 'COMPOSIO_MCP_HEADERS_FILE' .github/scripts/prepare-composio-mcp.sh
          grep -q 'x-api-key: %s' .github/scripts/prepare-composio-mcp.sh
          grep -q 'add-mask::\$mcp_url' .github/scripts/prepare-composio-mcp.sh
          grep -q 'persist-credentials: false' .github/workflows/opencode.yml
          grep -q 'contents: write' .github/workflows/opencode.yml
          grep -q 'issues: write' .github/workflows/opencode.yml
          grep -q 'pull-requests: write' .github/workflows/opencode.yml

      - name: Validate agent council
        shell: bash
        run: bash .github/scripts/validate-opencode-council.sh

      - name: Validate OpenCode V2 runtime and agent discovery
        shell: bash
        run: |
          set -euo pipefail
          export OPENCODE_V2_VERSION="2.0.3"
          npm view "@opencode/cli@${OPENCODE_V2_VERSION}" version --json | jq -e --arg v "$OPENCODE_V2_VERSION" '. == $v' >/dev/null
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          npm install --prefix "$tmp/opencode" --no-audit --no-fund --prefer-online --save-exact "@opencode/cli@${OPENCODE_V2_VERSION}" >/tmp/opencode-install.log 2>&1
          test -x "$tmp/opencode/bin/opencode"
          "$tmp/opencode/bin/opencode" --version
          "$tmp/opencode/bin/opencode" run --help | grep -q -- "--agent"
          "$tmp/opencode/bin/opencode" run --help | grep -q -- "--model"
          "$tmp/opencode/bin/opencode" run --help | grep -q -- "--standalone"
          agents="$("$tmp/opencode/bin/opencode" agent list)"
          printf "%s\n" "$agents"
          for agent in architect-reviewer adversarial-reviewer adjudicator verifier; do
            grep -q "$agent" <<< "$agents" || {
              echo "::error title=OpenCode V2 discovery failed::Missing $agent"
              exit 1
            }
          done
          [[ "$("$tmp/opencode/bin/opencode" --version)" == *"$OPENCODE_V2_VERSION"* ]]
      - name: Validate route selector structure
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/select-opencode-route.sh
          grep -q 'OPENCODE_ROUTE_INDEX' .github/scripts/select-opencode-route.sh
          grep -q 'OPENCODE_EXCLUDED_PROVIDERS' .github/scripts/select-opencode-route.sh
          grep -q 'is_free_model' .github/scripts/select-opencode-route.sh
          grep -q 'github-copilot/auto' .github/scripts/select-opencode-route.sh
          grep -q 'opencode/\$model' .github/scripts/select-opencode-route.sh
