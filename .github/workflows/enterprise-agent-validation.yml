name: enterprise-agent-validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'audit/**'
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f opencode.json
          test -f .github/workflows/opencode.yml
          test -f .github/scripts/select-opencode-route.sh
          test -f .github/scripts/run-opencode-attempt.sh
          test -f .github/scripts/classify-provider-failure.sh
          test -f .github/scripts/run-copilot-attempt.sh
          test -f .github/copilot-instructions.md
          test -f .opencode/instructions.md
          test -f docs/ENTERPRISE_AGENT_AUDIT.md
          test -f docs/GITHUB_NATIVE_COPILOT_AUDIT.md

      - name: Validate JSON and YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          jq empty opencode.json
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/opencode.yml"); YAML.load_file(".github/workflows/opencode-cache.yml"); YAML.load_file(".github/workflows/enterprise-agent-validation.yml")'

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/select-opencode-route.sh
          bash -n .github/scripts/run-opencode-attempt.sh
          bash -n .github/scripts/classify-provider-failure.sh
          bash -n .github/scripts/run-copilot-attempt.sh

      - name: Validate enterprise routing and recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'COPILOT_GITHUB_TOKEN' .github/workflows/opencode.yml
          grep -q '@github/copilot@1.0.86' .github/workflows/opencode.yml
          grep -q -- '--model auto' .github/scripts/run-copilot-attempt.sh
          grep -q -- '--additional-mcp-config' .github/scripts/run-copilot-attempt.sh
          grep -q 'github-copilot/auto' .github/scripts/select-opencode-route.sh
          ! grep -Eiq 'openrouter|huggingface|hugging-face|chat/completions|generateContent|streamGenerateContent' .github/workflows/opencode.yml .github/scripts/select-opencode-route.sh .github/scripts/run-copilot-attempt.sh
          ! grep -q 'opencode github run' .github/workflows/opencode.yml
          test "$(grep -c 'Run GitHub Copilot attempt' .github/workflows/opencode.yml)" -eq 1

      - name: Validate Copilot route selection without inference
        shell: bash
        run: |
          set -euo pipefail
          tmp_env="$(mktemp)"
          tmp_out="$(mktemp)"
          trap 'rm -f "$tmp_env" "$tmp_out"' EXIT
          : > "$tmp_env"
          : > "$tmp_out"
          COPILOT_GITHUB_TOKEN=test-token GITHUB_ENV="$tmp_env" GITHUB_OUTPUT="$tmp_out" bash .github/scripts/select-opencode-route.sh
          grep -q 'selected=true' "$tmp_out"
          grep -q 'route=github-copilot/auto' "$tmp_out"
          : > "$tmp_env"
          : > "$tmp_out"
          GITHUB_ENV="$tmp_env" GITHUB_OUTPUT="$tmp_out" bash .github/scripts/select-opencode-route.sh
          grep -q 'selected=false' "$tmp_out"

      - name: Validate security invariants
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.share == "disabled"' opencode.json >/dev/null
          jq -e '.permission.external_directory == "deny"' opencode.json >/dev/null
          jq -e '.permission.doom_loop == "deny"' opencode.json >/dev/null
          jq -e '.permission.bash["git push *"] == "deny"' opencode.json >/dev/null
          jq -e '.permission.bash["git commit *"] == "deny"' opencode.json >/dev/null
          jq -e '.permission.bash["git reset *"] == "deny"' opencode.json >/dev/null
          jq -e '.permission.bash["git clean *"] == "deny"' opencode.json >/dev/null
          jq -e '.permission.read["*.env"] == "deny"' opencode.json >/dev/null
          jq -e '.permission.read["*.env.*"] == "deny"' opencode.json >/dev/null
          jq -e '.permission.read[".env"] == "deny"' opencode.json >/dev/null
          jq -e '.permission.read[".npmrc"] == "deny"' opencode.json >/dev/null
          grep -q 'connect.composio.dev/mcp' .github/scripts/run-copilot-attempt.sh
          grep -q 'persist-credentials: false' .github/workflows/opencode.yml
          grep -q 'contents: write' .github/workflows/opencode.yml
          grep -q 'issues: write' .github/workflows/opencode.yml
          grep -q 'pull-requests: write' .github/workflows/opencode.yml
          ! grep -q 'id-token: write' .github/workflows/opencode.yml
          ! grep -q 'actions/cache/save' .github/workflows/opencode.yml
          ! grep -q 'anomalyco/opencode/github@latest' .github/workflows/opencode.yml
          ! grep -Eiq '(echo|printf)[[:space:]].*(GEMINI_API_KEY|OPENROUTER_API_KEY|COMPOSIO_API_KEY|COPILOT_GITHUB_TOKEN)' .github/workflows/opencode.yml .github/scripts/*.sh
          grep -q 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' .github/workflows/opencode.yml
          grep -q 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' .github/workflows/opencode.yml

      - name: Audit application packaging and reproducibility
        shell: bash
        run: |
          set -u
          if node -e 'const fs=require("fs"); const p=require("./package.json"); const s=p.scripts?.start||""; const m=s.match(/node\\s+([A-Za-z0-9_./-]+\\.js)/); if (m && !fs.existsSync(m[1])) process.exit(2)' 2>/dev/null; then
            echo "Start entrypoint exists."
          else
            echo "::warning title=Application packaging finding::package.json may reference a start-time JavaScript file that is absent from the repository tree."
          fi
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            echo "npm lockfile present."
          else
            echo "::warning title=No npm lockfile::Dependency installation is not fully reproducible yet."
          fi
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.test ? 0 : 1)' 2>/dev/null; then
            echo "Automated test script present."
          else
            echo "::warning title=No automated test script::Repository validation cannot claim a project test suite."
          fi

      - name: Audit main governance visibility
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          if gh api "repos/$GITHUB_REPOSITORY/branches/main/protection" >/dev/null 2>&1; then
            echo "main branch protection is visible."
          else
            echo "::warning title=Main branch protection unavailable::Repository governance must be configured deliberately in GitHub settings."
          fi
