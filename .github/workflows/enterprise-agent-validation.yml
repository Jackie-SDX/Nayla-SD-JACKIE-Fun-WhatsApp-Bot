name: enterprise-agent-validation

on:
  push:
    branches:
      - 'audit/**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: enterprise-agent-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/opencode.yml
          test -f .github/workflows/opencode-cache.yml
          test -f .github/scripts/select-opencode-route.sh
          test -f .opencode/instructions.md
          test -f opencode.json
          test -f .github/dependabot.yml
          test -f .github/CODEOWNERS
          test -f docs/ENTERPRISE_AGENT_AUDIT.md

      - name: Validate JSON and YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          jq empty opencode.json
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f); puts "YAML OK: #{f}" }'

      - name: Validate shell and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/select-opencode-route.sh
          node --check index.js
          node --check pair.js

      - name: Validate agent security invariants
        shell: bash
        run: |
          set -euo pipefail

          grep -q '"share": "disabled"' opencode.json
          grep -q '"external_directory": "deny"' opencode.json
          grep -q '"git push *": "deny"' opencode.json
          grep -q '"git push": "deny"' opencode.json
          grep -q 'connect.composio.dev/mcp' opencode.json

          grep -q 'contents: write' .github/workflows/opencode.yml
          grep -q 'issues: write' .github/workflows/opencode.yml
          grep -q 'pull-requests: write' .github/workflows/opencode.yml
          ! grep -q 'id-token: write' .github/workflows/opencode.yml
          ! grep -q 'actions/cache/save' .github/workflows/opencode.yml
          ! grep -q 'anomalyco/opencode/github@latest' .github/workflows/opencode.yml

          grep -q 'actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' .github/workflows/opencode.yml
          grep -q 'actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' .github/workflows/opencode-cache.yml
          grep -q 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' .github/workflows/opencode.yml
          grep -q 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' .github/workflows/enterprise-agent-validation.yml

      - name: Audit application packaging and reproducibility
        shell: bash
        run: |
          set -u
          if node -e 'const fs=require("fs"); const p=require("./package.json"); const s=p.scripts?.start||""; const m=s.match(/node\s+([A-Za-z0-9._/-]+\.js)/); if(m && !fs.existsSync(m[1])) process.exit(2)'; then
            echo "Start entrypoint exists."
          else
            echo "::warning title=Application packaging finding::package.json references a start-time JavaScript file that is absent from the repository tree."
          fi
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            echo "npm lockfile present."
          else
            echo "::warning title=No npm lockfile::Dependency installation is not fully reproducible yet."
          fi
          node -e 'const p=require("./package.json"); if(!p.scripts?.test) console.warn("::warning title=No automated test script::package.json has no test script.")'

      - name: Audit main governance visibility
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          if gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection" >/dev/null 2>&1; then
            echo "main branch protection is visible."
          else
            echo "::warning title=Main branch protection unavailable::Repository enforcement must be configured in GitHub settings."
          fi
