name: agent-evals
on:
  push:
    paths:
      - '.opencode/**'
      - 'opencode.json'
      - '.github/scripts/**'
      - '.github/agent-evals/**'
      - '.github/workflows/agent-evals.yml'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run extended cases too'
        required: false
        default: false
        type: boolean
      model:
        description: 'OpenCode model to evaluate'
        required: false
        default: 'opencode/mimo-v2.6-flash-free'
        type: string
  schedule:
    - cron: '17 2 * * *'

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      MODEL: ${{ inputs.model || 'opencode/mimo-v2.6-flash-free' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve OpenCode
        id: release
        shell: bash
        run: |
          set -euo pipefail
          json="$(mktemp)"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/anomalyco/opencode/releases/tags/v1.18.32" -o "$json"
          version="$(jq -r '.tag_name' "$json" | sed 's/^v//')"
          url="$(jq -r '.assets[] | select(.name=="opencode-linux-x64.tar.gz") | .browser_download_url' "$json")"
          digest="$(jq -r '.assets[] | select(.name=="opencode-linux-x64.tar.gz") | .digest' "$json")"
          test "$version" = '1.18.32'
          test "$digest" != 'null'
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 5 --max-time 120 "${{ steps.release.outputs.url }}" -o "$tmp/opencode.tar.gz"
          digest="${{ steps.release.outputs.digest }}"; digest="${digest#sha256:}"
          echo "$digest  $tmp/opencode.tar.gz" | sha256sum --check -
          mkdir -p "$tmp/extract" "$HOME/.opencode/bin"
          tar -xzf "$tmp/opencode.tar.gz" -C "$tmp/extract"
          install -Dm755 "$(find "$tmp/extract" -type f -name opencode -perm -u+x | head -n 1)" "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version
      - name: Validate corpus
        shell: bash
        run: jq -e '.schema_version == 1 and (.cases|length >= 11)' .github/agent-evals/cases.json
      - name: Run smoke evaluations
        shell: bash
        run: bash .github/scripts/run-agent-evals.sh --tier smoke --model "$MODEL"
      - name: Run extended evaluations
        if: github.event_name == 'schedule' || inputs.full == true
        shell: bash
        run: bash .github/scripts/run-agent-evals.sh --tier extended --model "$MODEL" --timeout 240
      - name: Upload evaluation metrics
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: agent-evals-${{ github.run_id }}
          path: |
            agent-eval-summary.json
            agent-eval-results.jsonl
          if-no-files-found: ignore
          retention-days: 90
